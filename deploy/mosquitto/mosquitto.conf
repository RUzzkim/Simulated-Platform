# 仅保留 TLS 监听，明文 1883 已关闭（公网只应暴露 TLS 端口）
listener 8883
allow_anonymous false
# 证书与账号文件由 compose 启动命令从 /mosquitto/config 拷到 /mosquitto/{certs,conf} 并 chown 给 mosquitto，
# 以避开绑定挂载上的属主/权限告警
password_file /mosquitto/conf/passwordfile
acl_file /mosquitto/conf/aclfile
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# 双向认证（阶段 4）：客户端必须出示由 cafile 签发的证书；用户名取自证书 CN
# （配合 use_identity_as_username true，ACL 里的 user <deviceCode> 直接按证书 CN 命中）。
# 打开后 passwordfile 只对未启用证书的客户端有意义，设备接入靠 server/issue-edge-cert.ps1 签发的证书。
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
# 订阅端（云端后端）短时跟不上时，broker 默认只缓存 1000 条就会丢；这里放宽到 10000
max_queued_messages 10000
# QoS1 并发投递窗口
max_inflight_messages 40