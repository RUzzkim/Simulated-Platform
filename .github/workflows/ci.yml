name: CI

on:
  push:
    branches: [develop, develop-C]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Maven / JDK 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: backend
        # CI 直连 Maven Central（本机开发才用 settings-mirror.xml 走阿里云）
        run: mvn -B --no-transfer-progress test

  edge:
    name: 边端（pytest / Python 3.12）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            edge/edge_node/requirements.txt
            edge/edge_node/requirements-dev.txt
      - name: 安装依赖
        working-directory: edge/edge_node
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: pytest（排除依赖真实 MQTT broker 的 e2e）
        working-directory: edge/edge_node
        run: |
          python -m pytest test -q \
            --ignore=test/test_status_e2e.py \
            --ignore=test/test_graceful_exit_e2e.py

  frontend:
    name: 前端（Vitest / Node 22）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          # jsdom 31 依赖要求 node ^22.14.0 || >=24，Node 20 下 undici 会崩
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: vitest
        working-directory: frontend
        run: npm run test
